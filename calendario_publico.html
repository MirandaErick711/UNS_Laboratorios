<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disponibilidad de Laboratorios | UNS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Enlace CSS de FullCalendar corregido -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">

    <link href="assets/css/style.css" rel="stylesheet">

    <style>
        .fc-toolbar-title { font-size: 1.2rem !important; text-transform: uppercase !important; }
        .fc-button-primary { background-color: var(--uns-rojo) !important; border-color: var(--uns-rojo) !important; }
        .fc-button-primary:hover { background-color: var(--uns-rojo-oscuro) !important; border-color: var(--uns-rojo-oscuro) !important; }
        .fc-button-active { background-color: var(--uns-rojo-oscuro) !important; }

        .header-publico {
            background: linear-gradient(160deg, var(--uns-rojo) 0%, var(--uns-rojo-oscuro) 100%);
            color: #fff;
            padding: 2.2rem 1rem;
            text-align: center;
        }
        .leyenda-item {
            display: inline-flex;
            align-items: center;
            margin-right: 1.2rem;
            font-size: 0.9rem;
        }
        .leyenda-punto {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
    </style>
</head>
<body class="bg-light">

<!-- ============================ -->
<!-- ENCABEZADO PÚBLICO           -->
<!-- ============================ -->
<div class="header-publico">
    <h3 class="fw-bold mb-1"><i class="bi bi-calendar2-week me-2"></i>Disponibilidad de Laboratorios</h3>
    <p class="mb-0">Universidad Nacional del Santa · Facultad de Ingeniería</p>
    <small class="opacity-75">Consulta pública — no requiere iniciar sesión</small>
</div>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
            <span class="leyenda-item"><span class="leyenda-punto" style="background-color:#198754;"></span>Reserva Aprobada</span>
            <span class="leyenda-item"><span class="leyenda-punto" style="background-color:#fd7e14;"></span>Reserva Pendiente</span>
        </div>
        <a href="index.html" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div id="calendarPublico"></div>
        </div>
    </div>

    <p class="text-center text-muted small mt-3">
        Este calendario es de solo lectura. Para reservar un laboratorio, el personal docente debe iniciar sesión.
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Enlace JS de FullCalendar corregido -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
    /**
     * Calendario público en modo SOLO LECTURA.
     * No permite crear, mover ni modificar reservas.
     */

    document.addEventListener('DOMContentLoaded', function () {

        const calendarEl =
            document.getElementById('calendarPublico');


        const calendar =
            new FullCalendar.Calendar(
                calendarEl,
                {

                    // ===================================================
                    // CONFIGURACION GENERAL
                    // ===================================================

                    initialView: 'dayGridMonth',

                    locale: 'es',

                    height: 'auto',

                    editable: false,

                    selectable: false,

                    eventStartEditable: false,

                    eventDurationEditable: false,


                    // ===================================================
                    // ENCABEZADO
                    // ===================================================

                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth,timeGridWeek'
                    },

                    buttonText: {
                        today: 'Hoy',
                        month: 'Mes',
                        week: 'Semana'
                    },


                    // ===================================================
                    // CARGAR RESERVAS PUBLICAS
                    // ===================================================

                    events: function (
                        fetchInfo,
                        successCallback,
                        failureCallback
                    ) {

                        fetch(
                            'api/reservas_publicas.php',
                            {
                                method: 'GET'
                            }
                        )

                        .then(response => {

                            if (!response.ok) {

                                throw new Error(
                                    'No se pudo cargar la disponibilidad.'
                                );
                            }

                            return response.json();
                        })

                        .then(data => {

                            console.log(
                                'Reservas publicas:',
                                data
                            );

                            successCallback(data);
                        })

                        .catch(error => {

                            console.error(
                                'Error al cargar reservas publicas:',
                                error
                            );

                            failureCallback(error);
                        });
                    },


                    // ===================================================
                    // COLOR SEGUN ESTADO
                    // ===================================================

                    eventDidMount: function(info) {

                        const estado =
                            info.event.extendedProps.estado || '';

                        let claseEstado = '';


                        if (estado === 'Pendiente') {

                            claseEstado =
                                'evento-pendiente';

                        } else if (estado === 'Aprobada') {

                            claseEstado =
                                'evento-aprobada';

                        } else if (estado === 'Rechazada') {

                            claseEstado =
                                'evento-rechazada';

                        } else if (estado === 'Cancelada') {

                            claseEstado =
                                'evento-cancelada';
                        }


                        if (claseEstado) {

                            info.el.classList.add(
                                claseEstado
                            );
                        }
                    },


                    // ===================================================
                    // CONTENIDO DE LA RESERVA
                    // ===================================================

                    eventContent: function(info) {

                        const inicio =
                            info.event.start;

                        const fin =
                            info.event.end;


                        const horaInicio =
                            inicio
                                ? inicio.toLocaleTimeString(
                                    'es-PE',
                                    {
                                        hour: '2-digit',
                                        minute: '2-digit',
                                        hour12: false
                                    }
                                )
                                : '';


                        const horaFin =
                            fin
                                ? fin.toLocaleTimeString(
                                    'es-PE',
                                    {
                                        hour: '2-digit',
                                        minute: '2-digit',
                                        hour12: false
                                    }
                                )
                                : '';


                        const estado =
                            info.event.extendedProps.estado || '';


                        const practica =
                            info.event.extendedProps.practica || '';


                        const laboratorio =
                            info.event.extendedProps.laboratorio ||
                            info.event.title;


                        const contenedor =
                            document.createElement('div');


                        contenedor.classList.add(
                            'evento-reserva'
                        );


                        // ===================================================
                        // HORA
                        // ===================================================

                        const elementoHora =
                            document.createElement('div');

                        elementoHora.classList.add(
                            'evento-hora'
                        );

                        elementoHora.textContent =
                            `${horaInicio} - ${horaFin}`;


                        // ===================================================
                        // LABORATORIO
                        // ===================================================

                        const elementoLaboratorio =
                            document.createElement('div');

                        elementoLaboratorio.classList.add(
                            'evento-laboratorio'
                        );

                        elementoLaboratorio.textContent =
                            laboratorio;


                        // ===================================================
                        // PRACTICA
                        // ===================================================

                        const elementoPractica =
                            document.createElement('div');

                        elementoPractica.classList.add(
                            'evento-practica'
                        );

                        elementoPractica.textContent =
                            practica;


                        // ===================================================
                        // ESTADO
                        // ===================================================

                        const elementoEstado =
                            document.createElement('div');

                        elementoEstado.classList.add(
                            'evento-estado'
                        );

                        elementoEstado.textContent =
                            estado;


                        // ===================================================
                        // AGREGAR INFORMACION
                        // ===================================================

                        contenedor.appendChild(
                            elementoHora
                        );

                        contenedor.appendChild(
                            elementoLaboratorio
                        );


                        if (practica) {

                            contenedor.appendChild(
                                elementoPractica
                            );
                        }


                        contenedor.appendChild(
                            elementoEstado
                        );


                        // ===================================================
                        // TOOLTIP
                        // ===================================================

                        contenedor.title =
                            practica
                                ? `${laboratorio} - ${practica}`
                                : laboratorio;


                        return {
                            domNodes: [contenedor]
                        };
                    }

                }
            );


        // ===========================================================
        // MOSTRAR CALENDARIO
        // ===========================================================

        calendar.render();

    });
</script>
</body>
</html>
