<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disponibilidad de Laboratorios | UNS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Enlace CSS de FullCalendar corregido -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">

    <link href="assets/css/style.css" rel="stylesheet">

    <style>
        .fc-toolbar-title { font-size: 1.2rem !important; text-transform: uppercase !important; }
        .fc-button-primary { background-color: var(--uns-rojo) !important; border-color: var(--uns-rojo) !important; }
        .fc-button-primary:hover { background-color: var(--uns-rojo-oscuro) !important; border-color: var(--uns-rojo-oscuro) !important; }
        .fc-button-active { background-color: var(--uns-rojo-oscuro) !important; }

        .header-publico {
            background: linear-gradient(160deg, var(--uns-rojo) 0%, var(--uns-rojo-oscuro) 100%);
            color: #fff;
            padding: 2.2rem 1rem;
            text-align: center;
        }
        .leyenda-item {
            display: inline-flex;
            align-items: center;
            margin-right: 1.2rem;
            font-size: 0.9rem;
        }
        .leyenda-punto {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
    </style>
</head>
<body class="bg-light">

<!-- ============================ -->
<!-- ENCABEZADO PÚBLICO           -->
<!-- ============================ -->
<div class="header-publico">
    <h3 class="fw-bold mb-1"><i class="bi bi-calendar2-week me-2"></i>Disponibilidad de Laboratorios</h3>
    <p class="mb-0">Universidad Nacional del Santa · Facultad de Ingeniería</p>
    <small class="opacity-75">Consulta pública — no requiere iniciar sesión</small>
</div>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
            <span class="leyenda-item"><span class="leyenda-punto" style="background-color:#198754;"></span>Reserva Aprobada</span>
            <span class="leyenda-item"><span class="leyenda-punto" style="background-color:#fd7e14;"></span>Reserva Pendiente</span>
        </div>
        <a href="index.html" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div id="calendarPublico"></div>
        </div>
    </div>

    <p class="text-center text-muted small mt-3">
        Este calendario es de solo lectura. Para reservar un laboratorio, el personal docente debe iniciar sesión.
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Enlace JS de FullCalendar corregido -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
    /**
     * Calendario público en modo SOLO LECTURA:
     *  - editable: false / selectable: false → nadie puede arrastrar ni crear eventos.
     *  - Consume api/reservas_publicas.php, que no exige sesión.
     */
    document.addEventListener('DOMContentLoaded', function () {
        const calendarEl = document.getElementById('calendarPublico');

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'es',
            height: 'auto',
            editable: false,
            selectable: false,
            eventStartEditable: false,
            eventDurationEditable: false,
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek'
            },
            buttonText: { today: 'Hoy', month: 'Mes', week: 'Semana' },

            events: function (fetchInfo, successCallback, failureCallback) {
                fetch('api/reservas_publicas.php', { method: 'GET' })
                    .then(response => {
                        if (!response.ok) throw new Error('No se pudo cargar la disponibilidad.');
                        return response.json();
                    })
                    .then(data => successCallback(data))
                    .catch(error => {
                        console.error(error);
                        failureCallback(error);
                    });
            }
        });

        calendar.render();
    });
</script>
</body>
</html>
