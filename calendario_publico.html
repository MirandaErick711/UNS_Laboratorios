<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disponibilidad de Laboratorios | UNS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css">
    <link href="assets/css/style.css" rel="stylesheet">

    <style>
        #calendarPublico {
            background: white;
            min-height: 500px;
        }

        .fc-toolbar-title {
            font-size: 1.2rem !important;
            text-transform: uppercase !important;
        }

        .fc-button-primary {
            background-color: var(--uns-rojo) !important;
            border-color: var(--uns-rojo) !important;
        }

        .fc-button-primary:hover,
        .fc-button-active {
            background-color: var(--uns-rojo-oscuro) !important;
            border-color: var(--uns-rojo-oscuro) !important;
        }

        .header-publico {
            background: linear-gradient(160deg, var(--uns-rojo), var(--uns-rojo-oscuro));
            color: #fff;
            padding: 2.2rem 1rem;
            text-align: center;
        }

        .leyenda-item {
            display: inline-flex;
            align-items: center;
            margin-right: 1.2rem;
            font-size: .9rem;
        }

        .leyenda-punto {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        @media (max-width: 768px) {
            .fc-toolbar {
                flex-wrap: wrap;
                gap: 5px;
            }

            .fc-toolbar-title {
                font-size: 1rem !important;
            }
        }
    </style>
</head>

<body class="bg-light">

<div class="header-publico">
    <h3 class="fw-bold mb-1">
        <i class="bi bi-calendar2-week me-2"></i>
        Disponibilidad de Laboratorios
    </h3>
    <p class="mb-0">Universidad Nacional del Santa · Facultad de Ingeniería</p>
    <small class="opacity-75">Consulta pública — no requiere iniciar sesión</small>
</div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
            <span class="leyenda-item">
                <span class="leyenda-punto" style="background-color:#198754;"></span>
                Reserva Aprobada
            </span>

            <span class="leyenda-item">
                <span class="leyenda-punto" style="background-color:#fd7e14;"></span>
                Reserva Pendiente
            </span>
        </div>

        <a href="index.html" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-box-arrow-in-right me-1"></i>
            Iniciar sesión
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div id="calendarPublico"></div>
        </div>
    </div>

    <p class="text-center text-muted small mt-3">
        Este calendario es de solo lectura.
        Para reservar un laboratorio, el personal docente debe iniciar sesión.
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const calendarEl = document.getElementById('calendarPublico');

    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'es',
        height: 'auto',
        editable: false,
        selectable: false,
        eventStartEditable: false,
        eventDurationEditable: false,

        titleFormat: {
            year: 'numeric',
            month: 'long'
        },

        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek'
        },

        buttonText: {
            today: 'Hoy',
            month: 'Mes',
            week: 'Semana'
        },

        // Carga las reservas publicas
        events: function (fetchInfo, successCallback, failureCallback) {
            fetch('api/reservas_publicas.php')
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('No se pudo cargar la disponibilidad.');
                    }

                    return response.json();
                })
                .then(function (data) {
                    if (!Array.isArray(data)) {
                        throw new Error(
                            data.message || 'La API no devolvio una lista de reservas.'
                        );
                    }

                    successCallback(data);
                })
                .catch(function (error) {
                    console.error('Error al cargar reservas publicas:', error);
                    failureCallback(error);
                });
        },

        // Aplica el estilo segun el estado
        eventDidMount: function (info) {
            const estado = info.event.extendedProps.estado || '';

            if (estado === 'Pendiente') {
                info.el.classList.add('evento-pendiente');
            } else if (estado === 'Aprobada') {
                info.el.classList.add('evento-aprobada');
            } else if (estado === 'Rechazada') {
                info.el.classList.add('evento-rechazada');
            } else if (estado === 'Cancelada') {
                info.el.classList.add('evento-cancelada');
            }
        },

        // Muestra la informacion de la reserva
        eventContent: function (info) {
            const inicio = info.event.start;
            const fin = info.event.end;

            const horaInicio = inicio
                ? inicio.toLocaleTimeString('es-PE', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                })
                : '';

            const horaFin = fin
                ? fin.toLocaleTimeString('es-PE', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                })
                : '';

            const estado = info.event.extendedProps.estado || '';
            const laboratorio =
                info.event.extendedProps.laboratorio || info.event.title;
            const practica = info.event.extendedProps.practica || '';

            const contenedor = document.createElement('div');
            contenedor.classList.add('evento-reserva');

            const elementoHora = document.createElement('div');
            elementoHora.classList.add('evento-hora');
            elementoHora.textContent = `${horaInicio} - ${horaFin}`;

            const elementoLaboratorio = document.createElement('div');
            elementoLaboratorio.classList.add('evento-laboratorio');
            elementoLaboratorio.textContent = laboratorio;

            const elementoEstado = document.createElement('div');
            elementoEstado.classList.add('evento-estado');
            elementoEstado.textContent = estado;

            contenedor.appendChild(elementoHora);
            contenedor.appendChild(elementoLaboratorio);

            if (practica) {
                const elementoPractica = document.createElement('div');
                elementoPractica.classList.add('evento-practica');
                elementoPractica.textContent = practica;
                contenedor.appendChild(elementoPractica);
            }

            contenedor.appendChild(elementoEstado);

            contenedor.title = practica
                ? `${laboratorio} - ${practica}`
                : laboratorio;

            return {
                domNodes: [contenedor]
            };
        }
    });

    calendar.render();
    window.calendarPublico = calendar;
});
</script>
</body>
</html>
